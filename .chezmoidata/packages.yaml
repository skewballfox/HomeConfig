packages:
  gui:  
    dnf:
      - google-chrome-stable
      - code
      - kitty
      - fira-code-fonts
      - gopass-jsonapi
      - gopass
      - gnupg2-scdaemon
      - gnupg2-gpg-agent
      # libgpgme.so.11 for the pinned yubikey-touch-detector release
      - compat-gpgme124
  rpm:
    - tailscale
    - fish
    - kitty-terminfo
    - mlir
    - mlir-devel
  dnf:
    - nix
    - just
    - htop
    - direnv
    - atuin
    - git-delta
    # post system-upgrade tasks. dnf only: atomic/coreos upgrades are image
    # based. See run_onchange_after_fedora-post-upgrade.sh.tmpl
    - rpmconf
    - remove-retired-packages
    - clean-rpm-gpg-pubkey
    - symlinks
    - dracut-config-rescue
  ostree:
    - nix-core
  brew:
    - helix
    - bat
    - htop
    - direnv
    - atuin
    - yazi
    - commitizen
    - getgrit/tap/grit
    - kargo
    - gh
    - tree
    - wild
    - nushell
  mac_brew:
    - font-fira-code-nerd-font
    - gopass
    - gopass-jsonapi
    - git-credential-manager
    - autoraise
    - jackielii/tap/skhd-zig
    - lgug2z/tap/komorebi-for-mac
    - argocd
    - fish
    - gnupg
    - pinentry-mac
    # newer less with --mouse; see conf.d/pager
    - less
  mac_casks:
    - scroll-reverser
  flatpaks:
    - com.github.tchx84.Flatseal
    - com.stremio.Stremio
    - org.signal.Signal
    - md.obsidian.Obsidian
    - com.slack.Slack
    - org.zulip.Zulip
    - net.ankiweb.Anki
  cargo:
    - cargo-sweep
    - sofka
    - taws
    - bpf-linker
  rustup_targets:
    # wasm
    - wasm32-unknown-unknown
    - wasm32-wasip1
    # android
    - aarch64-linux-android
    - armv7-linux-androideabi
    - i686-linux-android
    - x86_64-linux-android

  uv:
    # floor: fail loudly instead of backtracking to ancient builds when a new
    # Python lacks wheels. onnxruntime has no cp315 wheels yet, so pin 3.14.
    - spec: 'whisper-ctranslate2>=0.5'
      python: '3.14'
    - 'git+https://github.com/NVIDIA/skillspector.git'
