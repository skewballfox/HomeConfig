# Open the card in shared mode. Chrome and Electron apps (VS Code) keep a
# PC/SC connection open, and scdaemon's default exclusive connect then fails
# with "sharing violation", so gpg and ssh can't see the YubiKey.
#
# Alternatives that don't work on Fedora: masking or removing pcscd. Fedora's
# scdaemon is built without its internal CCID (libusb) driver, so PC/SC is the
# only path to the card.
# Known risk (man scdaemon): scdaemon caches card state and assumes exclusive
# access. If gpg/ssh gets confused, run: gpgconf --kill scdaemon
pcsc-shared
